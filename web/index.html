<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Agent Office</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script type="importmap">
    { "imports": { "three": "/static/three.module.js",
                   "three/addons/": "/static/" } }
  </script>
</head>
<body>
  <!-- 3D scene: the Three.js renderer appends <canvas id="office-canvas"> here -->
  <div id="office">
    <div id="bubbles" aria-hidden="true"></div>

    <div id="nogl" hidden>
      <b>WebGL is unavailable</b>
      <span>The 3D office can't render in this browser, but chat, activity and tasks still work.</span>
    </div>

    <div class="legend" aria-hidden="true">
      <span><i style="--c:#8792a3"></i>idle</span>
      <span><i style="--c:#fbbf24"></i>thinking</span>
      <span><i style="--c:#4f9cf9"></i>working</span>
      <span><i style="--c:#a78bfa"></i>testing</span>
      <span><i style="--c:#f87171"></i>blocked</span>
      <span><i style="--c:#34d399"></i>done</span>
    </div>

    <div class="viewbar">
      <span id="viewhint">Click an agent to follow · drag to orbit · scroll to zoom</span>
      <button id="resetview" type="button">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>
        <span>Reset view</span>
      </button>
    </div>
  </div>

  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7cb2ff" />
            <stop offset="1" stop-color="#9b7bff" />
          </linearGradient>
        </defs>
        <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#lg)" />
        <rect x="8" y="8" width="6" height="16" rx="1.5" fill="rgba(255,255,255,.92)" />
        <rect x="16" y="13" width="8" height="11" rx="1.5" fill="rgba(255,255,255,.62)" />
        <rect x="9.5" y="11" width="3" height="2" rx=".5" fill="#6a8fe8" />
        <rect x="9.5" y="15" width="3" height="2" rx=".5" fill="#6a8fe8" />
        <rect x="18" y="16" width="4" height="2" rx=".5" fill="#8b7bff" />
      </svg>
      <h1>Agent Office</h1>
      <div class="conn">
        <span class="dot" id="dot"></span>
        <span id="status">Connecting…</span>
      </div>
    </div>

    <div class="proj" aria-label="Project">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <select id="projectselect" title="Switch project" aria-label="Switch project">
        <option value="default">Default</option>
      </select>
      <button id="newproject" type="button" aria-label="New project" title="New project">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <div class="roles" aria-label="Agent roles">
      <span><i style="--c:#fbbf24"></i>CEO</span>
      <span><i style="--c:#4f9cf9"></i>Engineer</span>
      <span><i style="--c:#a78bfa"></i>QA</span>
    </div>

    <div class="hdr-stats" aria-label="Summary">
      <div class="chip"><span class="chip-k">Agents</span><b id="hdr-agents">0</b></div>
      <div class="chip"><span class="chip-k">Active</span><b id="hdr-active">0</b></div>
      <div class="chip"><span class="chip-k">Open tasks</span><b id="hdr-tasks">0</b></div>
      <div class="chip"><span class="chip-k">Floors</span><b id="hdr-floors">0</b></div>
      <button id="daynight" type="button" aria-pressed="false" title="Switch to day">
        <span class="dn-ic" aria-hidden="true">🌙</span><span class="dn-lbl">Night</span>
      </button>
      <button id="asidetoggle" type="button" aria-label="Toggle sidebar" title="Toggle sidebar">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg>
      </button>
    </div>
  </header>

  <aside>
    <div class="sheet-handle" id="sheethandle" role="button" tabindex="0" aria-label="Resize panel"><i></i></div>
    <div class="tabs" role="tablist">
      <button class="active" data-panel="chat" role="tab">
        <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
        <span>CEO</span>
      </button>
      <button data-panel="activity" role="tab">
        <svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
        <span>Activity</span>
      </button>
      <button data-panel="tasks" role="tab">
        <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>
        <span>Tasks</span><em class="count" id="tab-tasks-count" hidden>0</em>
      </button>
      <button data-panel="stats" role="tab">
        <svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
        <span>Stats</span>
      </button>
    </div>

    <div class="panel active" id="chat">
      <div id="messages"></div>
      <div id="chatform">
        <input id="chatinput" type="text" placeholder="Talk to the CEO…" autocomplete="off" />
        <button id="chatsend" aria-label="Send">
          <span>Send</span>
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>

    <div class="panel" id="activity">
      <div id="log"></div>
    </div>

    <div class="panel" id="tasks">
      <div id="tasksummary"></div>
      <div id="tasklist"></div>
    </div>

    <div class="panel" id="stats">
      <div id="metrics"></div>
      <h3 class="sect">Team</h3>
      <div id="roster"></div>
    </div>
  </aside>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
