<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Office</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #07090d;
    color: #e8edf5;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  form {
    width: min(320px, calc(100vw - 48px));
    padding: 32px 28px;
    background: rgba(14, 18, 26, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 6px;
  }
  .mark { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .mark i { width: 10px; height: 10px; border: 1.5px solid #7cb2ff; display: block; }
  .mark span { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #8b95a7; }
  input {
    width: 100%; padding: 10px 12px;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 4px; color: inherit; font: inherit; font-size: 14px; outline: none;
  }
  input:focus { border-color: #7cb2ff; }
  button {
    width: 100%; margin-top: 12px; padding: 10px 12px;
    background: transparent; color: #e8edf5; font: inherit; font-size: 14px;
    border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 4px; cursor: pointer;
  }
  button:hover { border-color: #7cb2ff; }
  button:disabled { opacity: 0.5; cursor: default; }
  .err { min-height: 18px; margin-top: 12px; font-size: 12px; color: #f87171; visibility: hidden; }
  .err.on { visibility: visible; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="mark"><i></i><span>Agent Office</span></div>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
  <button id="go" type="submit">Sign in</button>
  <div id="err" class="err">Wrong password</div>
</form>
<script>
  const f = document.getElementById("f"), pw = document.getElementById("pw");
  const go = document.getElementById("go"), err = document.getElementById("err");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    go.disabled = true;
    err.classList.remove("on");
    try {
      const r = await fetch("/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({password: pw.value}),
      });
      if (r.ok) { location.href = "/"; return; }
    } catch (_) {}
    err.classList.add("on");
    go.disabled = false;
    pw.focus();
    pw.select();
  });
</script>
</body>
</html>
